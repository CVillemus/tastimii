<header class="app-header">
  <div class="app-header__inner">
    <a class="app-header__brand" routerLink="/recettes">Tastimii</a>

    <!-- En haut sur desktop, fixée en bas de l'écran sur mobile. -->
    <nav class="main-navigation" aria-label="Navigation principale">
      <a
        class="main-navigation__tab"
        routerLink="/recettes"
        routerLinkActive="main-navigation__tab--active"
        ariaCurrentWhenActive="page"
      >
        <!-- Icônes Tabler (licence MIT) : livre ouvert, carotte. Le sac de courses est dessiné pour l'app. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
          <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
          <path d="M3 6v13M12 6v13M21 6v13" />
        </svg>
        Recettes
      </a>
      <a
        class="main-navigation__tab"
        routerLink="/courses"
        routerLinkActive="main-navigation__tab--active"
        ariaCurrentWhenActive="page"
      >
        <!-- Sac de courses en toile (cabas) : l'esprit marché local plutôt que grande surface. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9h14v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" />
          <path d="M8.5 12V7.5a3.5 3.5 0 0 1 7 0V12" />
        </svg>
        Courses
      </a>
      <!-- Toujours visible ; désactivé (pas un lien) tant qu'il n'y a rien à cuisiner. -->
      @if (kitchenStore.hasKitchenRecipes()) {
        <a
          class="main-navigation__tab"
          routerLink="/cuisine"
          routerLinkActive="main-navigation__tab--active"
          ariaCurrentWhenActive="page"
        >
          <!-- Toque (icône Tabler « chef-hat », licence MIT). -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723V21H6v-7.126a4 4 0 1 1 2.092-7.723A4 4 0 0 1 12 3z"
            />
            <path d="M6.161 17.009l11.839-.009" />
          </svg>
          Cuisine
        </a>
      } @else {
        <span
          class="main-navigation__tab main-navigation__tab--disabled"
          role="link"
          aria-disabled="true"
          title="Rien à cuisiner pour l'instant : validez d'abord vos courses"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723V21H6v-7.126a4 4 0 1 1 2.092-7.723A4 4 0 0 1 12 3z"
            />
            <path d="M6.161 17.009l11.839-.009" />
          </svg>
          Cuisine
        </span>
      }
      <a
        class="main-navigation__tab"
        routerLink="/ingredients"
        routerLinkActive="main-navigation__tab--active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 21s9.834-3.489 12.684-6.34a4.487 4.487 0 0 0 0-6.344 4.483 4.483 0 0 0-6.342 0C6.482 11.177 2.995 21.005 3 21z"
          />
          <path d="M9 13l-1.5-1.5M16 14l-2-2" />
          <path d="M22 8s-1.14-2-3-2c-1.406 0-3 2-3 2s1.14 2 3 2 3-2 3-2z" />
          <path d="M16 2s-2 1.14-2 3 2 3 2 3 2-1.577 2-3c0-1.86-2-3-2-3z" />
        </svg>
        Ingrédients
      </a>
    </nav>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
