<dialog
  #dialogElement
  class="confirmation-dialog"
  aria-labelledby="confirmation-dialog-title"
  (click)="closeOnBackdropClick($event)"
>
  <div class="confirmation-dialog__panel">
    <h2 id="confirmation-dialog-title" class="confirmation-dialog__title">{{ dialogTitle() }}</h2>
    <p class="confirmation-dialog__message">{{ message() }}</p>
    <div class="confirmation-dialog__actions">
      <button class="button" type="button" autofocus (click)="cancel()">
        {{ cancelLabel() }}
      </button>
      <button class="button confirmation-dialog__confirm" type="button" (click)="confirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
