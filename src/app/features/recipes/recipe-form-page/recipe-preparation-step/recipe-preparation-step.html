<!-- On réordonne les étapes en les faisant glisser par la poignée ⠿. -->
<ol class="step-lines" cdkDropList cdkDropListLockAxis="y" (cdkDropListDropped)="moveStep($event)">
  @for (stepField of stepsField(); track stepField) {
    <li class="step-line" cdkDrag>
      <div class="step-line__header">
        <button
          class="drag-handle"
          type="button"
          cdkDragHandle
          [attr.aria-label]="'Déplacer l’étape ' + ($index + 1)"
          (keydown.arrowup)="moveStepByKeyboard($index, -1, $event)"
          (keydown.arrowdown)="moveStepByKeyboard($index, 1, $event)"
        >
          ⠿
        </button>
        <label class="step-line__label" [for]="'step-title-' + $index">
          Étape {{ $index + 1 }}
        </label>
        <button
          class="icon-button icon-button--quiet"
          type="button"
          [attr.aria-label]="'Retirer l’étape ' + ($index + 1)"
          (click)="removeStep($index)"
        >
          ×
        </button>
      </div>
      <input
        [id]="'step-title-' + $index"
        class="step-line__title"
        type="text"
        placeholder="Titre de l’étape (facultatif) : Faire la préparation"
        [formField]="stepField.title"
        [attr.aria-describedby]="
          findStarterStepLegend(stepField.title().value()) !== null ? 'step-legend-' + $index : null
        "
      />
      @let starterStepLegend = findStarterStepLegend(stepField.title().value());
      @if (starterStepLegend !== null) {
        <p class="step-line__legend" [id]="'step-legend-' + $index">
          {{ starterStepLegend }}
        </p>
      }
      <app-rich-text-editor
        [editorLabel]="'Texte de l’étape ' + ($index + 1)"
        placeholder="Mélanger la farine et les œufs…"
        [formField]="stepField.contentHtml"
      />
    </li>
  }
</ol>
<button class="add-line-button" type="button" (click)="addStep()">+ Ajouter une étape</button>

<!-- En fin de recette : ce qu’on ajoute une fois la recette écrite. -->
<section class="recipe-tips">
  <h2 class="section-title">Astuces et variantes</h2>
  <app-rich-text-editor
    editorLabel="Astuces et variantes"
    placeholder="Four ou air fryer, version végétarienne, ce qu'on changera la prochaine fois…"
    [formField]="descriptionField()"
  />
</section>
