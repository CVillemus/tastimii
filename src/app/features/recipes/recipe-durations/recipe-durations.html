@let labels = durationLabels();
@if (labels !== null) {
  <!-- Couteau : préparation ; cocotte qui fume : cuisson. -->
  @if (labels.preparationLabel !== null) {
    <span class="recipe-duration" title="Préparation">
      <svg class="recipe-duration__icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- Couteau de cuisine : la lame en diagonale, le manche en bas à gauche. -->
        <path d="M20.5 3.5c-3.5 1-9 6.5-11.5 10l2.5 2.5c3.5-2.5 9-8 9-12.5z" />
        <path class="recipe-duration__knife-handle" d="M9.5 14.5l-5.5 5.5" />
      </svg>
      <span class="visually-hidden">Préparation :</span>
      {{ labels.preparationLabel }}
    </span>
  }
  @if (labels.cookingLabel !== null) {
    <span class="recipe-duration" title="Cuisson">
      <svg class="recipe-duration__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 13h14v4a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" />
        <path d="M3 13h18" />
        <path d="M8 9c-.8-.8.8-1.7 0-2.5S8.8 4.8 8 4" />
        <path d="M12 9c-.8-.8.8-1.7 0-2.5S12.8 4.8 12 4" />
        <path d="M16 9c-.8-.8.8-1.7 0-2.5S16.8 4.8 16 4" />
      </svg>
      <span class="visually-hidden">Cuisson :</span>
      {{ labels.cookingLabel }}
    </span>
  }
}
